name: Docker Image CI

on:
  push:
    branches: [ "main","sprint" ]
  pull_request:
    branches: [ "main","sprint"  ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
  build_and_push_image:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Push Docker Image (GHCR)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sms-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AUTH_API_URL=${{ vars.VITE_AUTH_API_URL || 'http://localhost:5118/' }}
            VITE_ACADEMIC_API_URL=${{ vars.VITE_ACADEMIC_API_URL || 'http://localhost:5136/' }}
            VITE_FINANCE_API_URL=${{ vars.VITE_FINANCE_API_URL || 'http://localhost:5137/' }}
            VITE_CAMPUS_API_URL=${{ vars.VITE_CAMPUS_API_URL || 'http://localhost:5139/' }}
            VITE_ENGAGEMENT_API_URL=${{ vars.VITE_ENGAGEMENT_API_URL || 'http://localhost:5140/' }}
            VITE_MEETING_API_URL=${{ vars.VITE_MEETING_API_URL || 'http://localhost:5141/' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
