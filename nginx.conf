server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker must never be cached, or an old worker keeps running after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Runtime API addresses, rewritten at container start: never let a browser keep an old copy.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Founder page: a standalone static page (not part of the SPA, not linked from the landing page).
    # Served at /founder (and /founder/) with the URL left as typed.
    location ~ ^/founder/?$ {
        try_files /founder-card.html =404;
    }

    # Crawler files: a real 404 if missing, never the SPA's index.html. Short cache so updates reach search engines.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    gzip on;
}